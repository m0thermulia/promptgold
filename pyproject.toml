[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptgold"
version = "0.1.0"
description = "pytest for prompts — write a test, get a baseline, catch regressions in CI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "rsubundamulia" }]
keywords = ["llm", "prompt", "testing", "pytest", "evals", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
all = ["openai>=1.0", "anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6", "openai>=1.0", "anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/rsubundamulia/promptgold"
Repository = "https://github.com/rsubundamulia/promptgold"

[project.entry-points.pytest11]
promptgold = "promptgold.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/promptgold"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Attack strings are data, not code — wrapping them hurts readability.
"src/promptgold/adversarial.py" = ["E501"]
